[project]
name = "claude-batch"
version = "0.2.0"
description = "Run a task over the rows of a CSV via claude -p (headless Claude Code)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
claude-batch = "claude_batch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_batch"]

[tool.hatch.build.targets.wheel.force-include]
"src/claude_batch/tasks" = "claude_batch/tasks"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
